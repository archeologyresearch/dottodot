<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodyk dottodot — Comic Periodical</title>
<style>
  :root {
    --black: #0a0a0a;
    --white: #ffffff;
    --gray: #666;
    --line: #ddd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--white);
    color: var(--black);
    font-family: "Courier New", Courier, monospace;
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    border-bottom: 3px solid var(--black);
    padding: 40px 20px 20px;
    text-align: center;
  }
  header h1 {
    font-size: clamp(2rem, 8vw, 5rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 900;
    border: 3px solid var(--black);
    display: inline-block;
    padding: 15px 30px;
    margin-bottom: 15px;
  }
  header .issue {
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    color: var(--gray);
    text-transform: uppercase;
  }
  header .issue span {
    color: var(--black);
    border-bottom: 1px solid var(--black);
  }
  .lang-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--line);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    flex-wrap: wrap;
  }
  .lang-bar .label { color: var(--gray); }
  .lang-bar a {
    color: var(--black);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding: 2px 0;
    transition: border-color 0.3s;
  }
  .lang-bar a:hover { border-color: var(--black); }
  nav {
    border-bottom: 1px solid var(--line);
    padding: 15px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    background: var(--white);
    z-index: 10;
  }
  nav a {
    color: var(--gray);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 0.8rem;
    margin: 0 15px;
    transition: color 0.3s;
  }
  nav a:hover { color: var(--black); }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 20px;
  }
  .comic {
    border: 2px solid var(--black);
    margin-bottom: 80px;
    padding: 30px;
    position: relative;
  }
  .comic::before {
    content: attr(data-episode);
    position: absolute;
    top: -12px;
    left: 20px;
    background: var(--white);
    padding: 0 10px;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--black);
  }
  .comic h2 {
    font-size: 1.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
  }
  .comic .meta {
    font-size: 0.75rem;
    color: var(--gray);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 25px;
  }
  .comic .panel {
    width: 100%;
    border: 2px solid var(--black);
    margin: 20px 0;
    display: block;
    background: var(--white);
    min-height: 200px;
    object-fit: cover;
  }
  svg.panel {
    width: 100%;
    height: auto;
    display: block;
    border: 2px solid var(--black);
    margin: 20px 0;
    background: var(--white);
  }
  .comic p { margin: 15px 0; font-size: 1rem; }
  .comic .dialogue {
    border-left: 4px solid var(--black);
    padding-left: 15px;
    font-style: italic;
    color: var(--gray);
    margin: 20px 0;
  }
  .archive {
    border: 2px solid var(--black);
    padding: 30px;
    margin-bottom: 80px;
    position: relative;
  }
  .archive::before {
    content: "Archive";
    position: absolute;
    top: -12px;
    left: 20px;
    background: var(--white);
    padding: 0 10px;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--black);
  }
  .archive ul { list-style: none; margin-top: 15px; }
  .archive li {
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
    font-size: 0.95rem;
  }
  .archive li:last-child { border-bottom: none; }
  .archive a {
    color: var(--black);
    text-decoration: none;
    border-bottom: 1px solid var(--black);
    letter-spacing: 0.05em;
  }
  .archive a:hover { color: var(--gray); border-color: var(--gray); }
  .archive .num {
    color: var(--gray);
    margin-right: 12px;
    letter-spacing: 0.2em;
    font-size: 0.8rem;
  }
  .archive .date {
    color: var(--gray);
    font-size: 0.75rem;
    margin-left: 10px;
    letter-spacing: 0.1em;
  }
  footer {
    border-top: 3px solid var(--black);
    padding: 40px 20px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--gray);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  footer a {
    color: var(--black);
    text-decoration: none;
    border-bottom: 1px solid var(--gray);
  }
  @media (max-width: 600px) {
    header h1 { letter-spacing: 0.15em; padding: 10px 15px; }
    .comic { padding: 20px; }
    nav a { display: inline-block; margin: 5px 10px; }
    .lang-bar { justify-content: center; }
    .archive { padding: 20px; }
  }
</style>
</head>
<body>

<div class="lang-bar">
  <span class="label">Language:</span>
  <div id="translate"></div>
</div>

<header>
  <h1>Periodyk dottodot</h1>
  <p class="issue">Issue <span>001</span> — Special Edition</p>
</header>

<nav id="nav"></nav>

<main id="episodes"></main>

<section class="archive" id="archive">
  <h2 style="display:none;">Archive</h2>
  <ul id="archiveList"></ul>
</section>

<footer id="about">
  <p>Periodyk dottodot — independent comic publishing</p>
  <p>Contact: <a href="mailto:bookq@protonmail.com">bookq@protonmail.com</a></p>
</footer>

<script src="episodes.js"></script>

<!-- translate.js 开源库 - 直接从 CDN 调用 -->
<script src="https://cdn.staticfile.net/translate.js/3.2.1/translate.js"></script>
<script>
  translate.service.use('client.edge');
  translate.language.setLocal('english');
  translate.execute();
</script>

</body>
</html>
